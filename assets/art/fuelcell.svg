<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Hydrogen fuel-cell shop-floor data platform" class="art-fuelcell">
<title>Hydrogen fuel-cell shop-floor data platform</title>
<defs>
<linearGradient id="fuelcell-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#FF6B2C"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
<linearGradient id="fuelcell-gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B2C" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></linearGradient>
<filter id="fuelcell-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="fuelcell-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="fuelcell-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F2F0EB" stroke-opacity=".06"/></pattern>
</defs>
<style>
.art-fuelcell .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art-fuelcell .mono{font:500 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#9AA0AB}
.art-fuelcell .flow{stroke-dasharray:6 8;animation:fuelcell-flow 2.4s linear infinite}
.art-fuelcell .pulse{animation:fuelcell-pulse 2.6s ease-in-out infinite}
.art-fuelcell .blink{animation:fuelcell-blink 1.6s steps(2,end) infinite}
.art-fuelcell .scan{animation:fuelcell-scan 3.2s ease-in-out infinite}
.art-fuelcell .spin{transform-origin:center;transform-box:fill-box;animation:fuelcell-spin 12s linear infinite}
.art-fuelcell .float{animation:fuelcell-float 5s ease-in-out infinite}
@keyframes fuelcell-flow{to{stroke-dashoffset:-28}}
@keyframes fuelcell-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes fuelcell-blink{50%{opacity:.15}}
@keyframes fuelcell-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,80px))}}
@keyframes fuelcell-spin{to{transform:rotate(360deg)}}
@keyframes fuelcell-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media (prefers-reduced-motion:reduce){.art-fuelcell *{animation:none}}
</style>
<rect width="480" height="300" fill="url(#fuelcell-grid)"/>
<ellipse cx="240" cy="160" rx="200" ry="110" fill="#FF6B2C" fill-opacity=".12" filter="url(#fuelcell-blur)"/>

<g><rect x="60" y="70" width="120" height="7" rx="2" fill="#22D3EE" fill-opacity=".45" stroke="#22D3EE" stroke-opacity=".7" class="pulse" style="animation-delay:0.0s"/><rect x="60" y="81" width="120" height="7" rx="2" fill="#FF6B2C" fill-opacity=".45" stroke="#FF6B2C" stroke-opacity=".7" class="pulse" style="animation-delay:0.12s"/><rect x="60" y="92" width="120" height="7" rx="2" fill="#22D3EE" fill-opacity=".45" stroke="#22D3EE" stroke-opacity=".7" class="pulse" style="animation-delay:0.24s"/><rect x="60" y="103" width="120" height="7" rx="2" fill="#FF6B2C" fill-opacity=".45" stroke="#FF6B2C" stroke-opacity=".7" class="pulse" style="animation-delay:0.36s"/><rect x="60" y="114" width="120" height="7" rx="2" fill="#22D3EE" fill-opacity=".45" stroke="#22D3EE" stroke-opacity=".7" class="pulse" style="animation-delay:0.48s"/><rect x="60" y="125" width="120" height="7" rx="2" fill="#FF6B2C" fill-opacity=".45" stroke="#FF6B2C" stroke-opacity=".7" class="pulse" style="animation-delay:0.6s"/><rect x="60" y="136" width="120" height="7" rx="2" fill="#22D3EE" fill-opacity=".45" stroke="#22D3EE" stroke-opacity=".7" class="pulse" style="animation-delay:0.72s"/><rect x="60" y="147" width="120" height="7" rx="2" fill="#FF6B2C" fill-opacity=".45" stroke="#FF6B2C" stroke-opacity=".7" class="pulse" style="animation-delay:0.84s"/><rect x="60" y="158" width="120" height="7" rx="2" fill="#22D3EE" fill-opacity=".45" stroke="#22D3EE" stroke-opacity=".7" class="pulse" style="animation-delay:0.96s"/><rect x="60" y="169" width="120" height="7" rx="2" fill="#FF6B2C" fill-opacity=".45" stroke="#FF6B2C" stroke-opacity=".7" class="pulse" style="animation-delay:1.08s"/><rect x="60" y="180" width="120" height="7" rx="2" fill="#22D3EE" fill-opacity=".45" stroke="#22D3EE" stroke-opacity=".7" class="pulse" style="animation-delay:1.2s"/><rect x="60" y="191" width="120" height="7" rx="2" fill="#FF6B2C" fill-opacity=".45" stroke="#FF6B2C" stroke-opacity=".7" class="pulse" style="animation-delay:1.3199999999999998s"/><rect x="60" y="202" width="120" height="7" rx="2" fill="#22D3EE" fill-opacity=".45" stroke="#22D3EE" stroke-opacity=".7" class="pulse" style="animation-delay:1.44s"/><rect x="60" y="213" width="120" height="7" rx="2" fill="#FF6B2C" fill-opacity=".45" stroke="#FF6B2C" stroke-opacity=".7" class="pulse" style="animation-delay:1.56s"/></g>
<text class="mono" x="120" y="246" text-anchor="middle">FUEL-CELL STACK</text>
<rect x="36" y="36" width="34" height="18" rx="9" fill="#06080D" stroke="#22D3EE" stroke-opacity=".8"/><text class="mono" x="53.0" y="48.5" text-anchor="middle" fill="#22D3EE" style="fill:#22D3EE">H2</text><rect x="160" y="36" width="34" height="18" rx="9" fill="#06080D" stroke="#FF3D7F" stroke-opacity=".8"/><text class="mono" x="177.0" y="48.5" text-anchor="middle" fill="#FF3D7F" style="fill:#FF3D7F">O2</text>
<path class="ln flow" d="M186 90 C 230 90, 240 120, 290 120" stroke="#22D3EE" stroke-width="1.5"/><path class="ln flow" d="M186 150 C 230 150, 240 150, 290 150" stroke="#FF6B2C" stroke-width="1.5"/><path class="ln flow" d="M186 210 C 230 210, 240 180, 290 180" stroke="#FF3D7F" stroke-width="1.5"/>
<g transform="translate(300 80)"><rect width="130" height="150" rx="8" fill="#0E121B" stroke="#A3E635" stroke-opacity=".6"/><g transform="translate(0 12)"><rect x="10" width="110" height="18" rx="3" fill="#06080D" stroke="#9AA0AB" stroke-opacity=".4"/><circle class="blink" cx="24" cy="9" r="3" fill="#A3E635" style="animation-delay:0.0s"/><rect x="36" y="7" width="60" height="4" rx="2" fill="#F2F0EB" fill-opacity=".3"/></g><g transform="translate(0 38)"><rect x="10" width="110" height="18" rx="3" fill="#06080D" stroke="#9AA0AB" stroke-opacity=".4"/><circle class="blink" cx="24" cy="9" r="3" fill="#A3E635" style="animation-delay:0.3s"/><rect x="36" y="7" width="60" height="4" rx="2" fill="#F2F0EB" fill-opacity=".3"/></g><g transform="translate(0 64)"><rect x="10" width="110" height="18" rx="3" fill="#06080D" stroke="#9AA0AB" stroke-opacity=".4"/><circle class="blink" cx="24" cy="9" r="3" fill="#A3E635" style="animation-delay:0.6s"/><rect x="36" y="7" width="60" height="4" rx="2" fill="#F2F0EB" fill-opacity=".3"/></g><g transform="translate(0 90)"><rect x="10" width="110" height="18" rx="3" fill="#06080D" stroke="#9AA0AB" stroke-opacity=".4"/><circle class="blink" cx="24" cy="9" r="3" fill="#A3E635" style="animation-delay:0.8999999999999999s"/><rect x="36" y="7" width="60" height="4" rx="2" fill="#F2F0EB" fill-opacity=".3"/></g><g transform="translate(0 116)"><rect x="10" width="110" height="18" rx="3" fill="#06080D" stroke="#9AA0AB" stroke-opacity=".4"/><circle class="blink" cx="24" cy="9" r="3" fill="#A3E635" style="animation-delay:1.2s"/><rect x="36" y="7" width="60" height="4" rx="2" fill="#F2F0EB" fill-opacity=".3"/></g></g>
<text class="mono" x="365" y="248" text-anchor="middle">.NET · SQL SERVER</text>
<text class="mono" x="365" y="60" text-anchor="middle" style="fill:#A3E635">6 SHOP FLOORS · 1,000+ HRS</text>

</svg>