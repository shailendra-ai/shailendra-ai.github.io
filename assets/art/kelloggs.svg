<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Demand forecasting for 1,500 SKUs across 14 countries" class="art-kelloggs">
<title>Demand forecasting for 1,500 SKUs across 14 countries</title>
<defs>
<linearGradient id="kelloggs-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#FF6B2C"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
<linearGradient id="kelloggs-gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B2C" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></linearGradient>
<filter id="kelloggs-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="kelloggs-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="kelloggs-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F2F0EB" stroke-opacity=".06"/></pattern>
</defs>
<style>
.art-kelloggs .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art-kelloggs .mono{font:500 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#9AA0AB}
.art-kelloggs .flow{stroke-dasharray:6 8;animation:kelloggs-flow 2.4s linear infinite}
.art-kelloggs .pulse{animation:kelloggs-pulse 2.6s ease-in-out infinite}
.art-kelloggs .blink{animation:kelloggs-blink 1.6s steps(2,end) infinite}
.art-kelloggs .scan{animation:kelloggs-scan 3.2s ease-in-out infinite}
.art-kelloggs .spin{transform-origin:center;transform-box:fill-box;animation:kelloggs-spin 12s linear infinite}
.art-kelloggs .float{animation:kelloggs-float 5s ease-in-out infinite}
@keyframes kelloggs-flow{to{stroke-dashoffset:-28}}
@keyframes kelloggs-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes kelloggs-blink{50%{opacity:.15}}
@keyframes kelloggs-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,80px))}}
@keyframes kelloggs-spin{to{transform:rotate(360deg)}}
@keyframes kelloggs-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media (prefers-reduced-motion:reduce){.art-kelloggs *{animation:none}}
</style>
