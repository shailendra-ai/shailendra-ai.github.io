<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Quotations converted into purchase requisitions" class="art-procurement">
<title>Quotations converted into purchase requisitions</title>
<defs>
<linearGradient id="procurement-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#FF6B2C"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
<linearGradient id="procurement-gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B2C" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></linearGradient>
<filter id="procurement-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="procurement-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="procurement-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F2F0EB" stroke-opacity=".06"/></pattern>
</defs>
<style>
.art-procurement .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art-procurement .mono{font:500 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#9AA0AB}
.art-procurement .flow{stroke-dasharray:6 8;animation:procurement-flow 2.4s linear infinite}
.art-procurement .pulse{animation:procurement-pulse 2.6s ease-in-out infinite}
.art-procurement .blink{animation:procurement-blink 1.6s steps(2,end) infinite}
.art-procurement .scan{animation:procurement-scan 3.2s ease-in-out infinite}
.art-procurement .spin{transform-origin:center;transform-box:fill-box;animation:procurement-spin 12s linear infinite}
.art-procurement .float{animation:procurement-float 5s ease-in-out infinite}
@keyframes procurement-flow{to{stroke-dashoffset:-28}}
@keyframes procurement-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes procurement-blink{50%{opacity:.15}}
@keyframes procurement-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,80px))}}
@keyframes procurement-spin{to{transform:rotate(360deg)}}
@keyframes procurement-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media (prefers-reduced-motion:reduce){.art-procurement *{animation:none}}
</style>
<rect width="480" height="300" fill="url(#procurement-grid)"/>
<ellipse cx="240" cy="160" rx="200" ry="110" fill="#FF6B2C" fill-opacity=".12" filter="url(#procurement-blur)"/>

<g class=""><rect x="56" y="70" width="110" height="140" rx="6" fill="#0E121B" stroke="#22D3EE" stroke-opacity=".7"/><path d="M148 70v18h18" fill="none" stroke="#22D3EE" stroke-opacity=".7"/><rect x="68" y="96" width="86" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="68" y="108" width="76" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="68" y="120" width="66" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="68" y="132" width="86" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="68" y="144" width="76" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="68" y="156" width="66" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="68" y="168" width="86" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><text class="mono" x="111.0" y="224" text-anchor="middle">QUOTATION · PDF</text></g>
<rect x="70" y="150" width="60" height="4" rx="2" fill="#FFB020" fill-opacity=".7"/>
<g class=""><rect x="314" y="70" width="110" height="140" rx="6" fill="#0E121B" stroke="#FF3D7F" stroke-opacity=".7"/><path d="M406 70v18h18" fill="none" stroke="#FF3D7F" stroke-opacity=".7"/><text class="mono" x="369.0" y="224" text-anchor="middle">PURCHASE REQUISITION</text></g>
<g stroke="#FF3D7F" stroke-width="1.4" fill="none">
<rect x="328" y="100" width="10" height="10" rx="2"/><path class="pulse" d="M330 105l3 3 5-6" style="animation-delay:0.0s"/><rect x="346" y="103" width="56" height="4" rx="2" fill="#F2F0EB" fill-opacity=".35" stroke="none"/><rect x="328" y="118" width="10" height="10" rx="2"/><path class="pulse" d="M330 123l3 3 5-6" style="animation-delay:0.4s"/><rect x="346" y="121" width="45" height="4" rx="2" fill="#F2F0EB" fill-opacity=".35" stroke="none"/><rect x="328" y="136" width="10" height="10" rx="2"/><path class="pulse" d="M330 141l3 3 5-6" style="animation-delay:0.8s"/><rect x="346" y="139" width="34" height="4" rx="2" fill="#F2F0EB" fill-opacity=".35" stroke="none"/><rect x="328" y="154" width="10" height="10" rx="2"/><path class="pulse" d="M330 159l3 3 5-6" style="animation-delay:1.2000000000000002s"/><rect x="346" y="157" width="53" height="4" rx="2" fill="#F2F0EB" fill-opacity=".35" stroke="none"/><rect x="328" y="172" width="10" height="10" rx="2"/><path class="pulse" d="M330 177l3 3 5-6" style="animation-delay:1.6s"/><rect x="346" y="175" width="42" height="4" rx="2" fill="#F2F0EB" fill-opacity=".35" stroke="none"/>
</g>
<path class="ln" d="M170 140 H 310" stroke="url(#procurement-g)" stroke-width="3"/>
<path class="ln flow" d="M170 140 H 310" stroke="#F2F0EB" stroke-width="2"/>
<g class="ln" stroke="#22D3EE" stroke-width="1.2"><rect x="222" y="118" width="40" height="44" rx="8" fill="#0E121B"/><circle cx="242" cy="140" r="9"/><circle class="pulse" cx="242" cy="140" r="3" fill="#22D3EE"/></g>
<text class="mono" x="242" y="178" text-anchor="middle">VISION LLM</text>
<rect class="scan" x="58" y="74" width="106" height="2" fill="#A3E635" style="--d:130px"/>

</svg>