<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Pearson inventory optimisation across 12 countries" class="art-pearson">
<title>Pearson inventory optimisation across 12 countries</title>
<defs>
<linearGradient id="pearson-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#FF6B2C"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
<linearGradient id="pearson-gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B2C" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></linearGradient>
<filter id="pearson-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="pearson-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="pearson-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F2F0EB" stroke-opacity=".06"/></pattern>
</defs>
<style>
.art-pearson .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art-pearson .mono{font:500 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#9AA0AB}
.art-pearson .flow{stroke-dasharray:6 8;animation:pearson-flow 2.4s linear infinite}
.art-pearson .pulse{animation:pearson-pulse 2.6s ease-in-out infinite}
.art-pearson .blink{animation:pearson-blink 1.6s steps(2,end) infinite}
.art-pearson .scan{animation:pearson-scan 3.2s ease-in-out infinite}
.art-pearson .spin{transform-origin:center;transform-box:fill-box;animation:pearson-spin 12s linear infinite}
.art-pearson .float{animation:pearson-float 5s ease-in-out infinite}
@keyframes pearson-flow{to{stroke-dashoffset:-28}}
@keyframes pearson-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes pearson-blink{50%{opacity:.15}}
@keyframes pearson-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,80px))}}
@keyframes pearson-spin{to{transform:rotate(360deg)}}
@keyframes pearson-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pearson-shrink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}} .art-pearson .shrink{animation:pearson-shrink 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.art-pearson *{animation:none}}
</style>
<rect width="480" height="300" fill="url(#pearson-grid)"/>
<ellipse cx="240" cy="160" rx="200" ry="110" fill="#FF6B2C" fill-opacity=".12" filter="url(#pearson-blur)"/>

