<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Vision model reading delivery orders and weighbridge slips" class="art-logistics">
<title>Vision model reading delivery orders and weighbridge slips</title>
<defs>
<linearGradient id="logistics-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#FF6B2C"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
<linearGradient id="logistics-gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B2C" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></linearGradient>
<filter id="logistics-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="logistics-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="logistics-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F2F0EB" stroke-opacity=".06"/></pattern>
</defs>
<style>
.art-logistics .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art-logistics .mono{font:500 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#9AA0AB}
.art-logistics .flow{stroke-dasharray:6 8;animation:logistics-flow 2.4s linear infinite}
.art-logistics .pulse{animation:logistics-pulse 2.6s ease-in-out infinite}
.art-logistics .blink{animation:logistics-blink 1.6s steps(2,end) infinite}
.art-logistics .scan{animation:logistics-scan 3.2s ease-in-out infinite}
.art-logistics .spin{transform-origin:center;transform-box:fill-box;animation:logistics-spin 12s linear infinite}
.art-logistics .float{animation:logistics-float 5s ease-in-out infinite}
@keyframes logistics-flow{to{stroke-dashoffset:-28}}
@keyframes logistics-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes logistics-blink{50%{opacity:.15}}
@keyframes logistics-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,80px))}}
@keyframes logistics-spin{to{transform:rotate(360deg)}}
@keyframes logistics-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media (prefers-reduced-motion:reduce){.art-logistics *{animation:none}}
</style>
<rect width="480" height="300" fill="url(#logistics-grid)"/>
<ellipse cx="240" cy="160" rx="200" ry="110" fill="#FF6B2C" fill-opacity=".12" filter="url(#logistics-blur)"/>

<rect x="40" y="214" width="250" height="10" rx="2" fill="#0E121B" stroke="#22D3EE" stroke-opacity=".6"/>
<text class="mono" x="165" y="246" text-anchor="middle">WEIGHBRIDGE · 32.4 T</text>
<g class="ln" stroke="#22D3EE" stroke-width="1.6">
<path d="M70 206v-44h58l14 20h40v24z" fill="#0E121B"/>
<path d="M182 206v-54h100l-14 54z" fill="#0E121B"/>
<path d="M200 160l20-32h50l6 32"/>
<circle cx="92" cy="206" r="11" fill="#06080D"/><circle cx="200" cy="206" r="11" fill="#06080D"/><circle cx="240" cy="206" r="11" fill="#06080D"/>
<circle class="spin" cx="92" cy="206" r="6" stroke-dasharray="4 5"/><circle class="spin" cx="200" cy="206" r="6" stroke-dasharray="4 5"/><circle class="spin" cx="240" cy="206" r="6" stroke-dasharray="4 5"/>
</g>
<ellipse cx="232" cy="150" rx="26" ry="14" fill="none" stroke="#FF3D7F" stroke-opacity=".8" class="pulse"/>
<g class=""><rect x="330" y="48" width="96" height="118" rx="6" fill="#0E121B" stroke="#22D3EE" stroke-opacity=".7"/><path d="M408 48v18h18" fill="none" stroke="#22D3EE" stroke-opacity=".7"/><rect x="342" y="74" width="72" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="342" y="86" width="62" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="342" y="98" width="52" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="342" y="110" width="72" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="342" y="122" width="62" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="342" y="134" width="52" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><text class="mono" x="378.0" y="180" text-anchor="middle">DELIVERY ORDER</text></g>
<rect x="342" y="72" width="60" height="9" rx="2" fill="#22D3EE" fill-opacity=".25" stroke="#22D3EE" class="pulse"/>
<rect x="342" y="96" width="44" height="9" rx="2" fill="#FF3D7F" fill-opacity=".25" stroke="#FF3D7F" class="pulse" style="animation-delay:.8s"/>
<rect class="scan" x="332" y="52" width="92" height="2" fill="#A3E635" style="--d:100px"/>
<path class="ln flow" d="M300 150 C 320 150, 318 110, 332 110" stroke="#FF3D7F" stroke-width="1.5"/>
<path class="ln flow" d="M378 170 C 378 200, 340 220, 310 222" stroke="#22D3EE" stroke-width="1.5"/>
<rect x="360" y="212" width="78.0" height="18" rx="9" fill="#06080D" stroke="#A3E635" stroke-opacity=".8"/><text class="mono" x="399.0" y="224.5" text-anchor="middle" fill="#A3E635" style="fill:#A3E635">OCR → JSON</text>
<circle class="blink" cx="452" cy="30" r="4" fill="#A3E635"/><text class="mono" x="444" y="34" text-anchor="end">LIVE</text>

</svg>