<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Three-way matching of invoices against Oracle ERP" class="art-payables">
<title>Three-way matching of invoices against Oracle ERP</title>
<defs>
<linearGradient id="payables-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#FF6B2C"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
<linearGradient id="payables-gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B2C" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></linearGradient>
<filter id="payables-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="payables-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="payables-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F2F0EB" stroke-opacity=".06"/></pattern>
</defs>
<style>
.art-payables .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art-payables .mono{font:500 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#9AA0AB}
.art-payables .flow{stroke-dasharray:6 8;animation:payables-flow 2.4s linear infinite}
.art-payables .pulse{animation:payables-pulse 2.6s ease-in-out infinite}
.art-payables .blink{animation:payables-blink 1.6s steps(2,end) infinite}
.art-payables .scan{animation:payables-scan 3.2s ease-in-out infinite}
.art-payables .spin{transform-origin:center;transform-box:fill-box;animation:payables-spin 12s linear infinite}
.art-payables .float{animation:payables-float 5s ease-in-out infinite}
@keyframes payables-flow{to{stroke-dashoffset:-28}}
@keyframes payables-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes payables-blink{50%{opacity:.15}}
@keyframes payables-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,80px))}}
@keyframes payables-spin{to{transform:rotate(360deg)}}
@keyframes payables-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media (prefers-reduced-motion:reduce){.art-payables *{animation:none}}
</style>
<rect width="480" height="300" fill="url(#payables-grid)"/>
<ellipse cx="240" cy="160" rx="200" ry="110" fill="#FF6B2C" fill-opacity=".12" filter="url(#payables-blur)"/>

<g class=""><rect x="44" y="30" width="72" height="86" rx="6" fill="#0E121B" stroke="#22D3EE" stroke-opacity=".7"/><path d="M98 30v18h18" fill="none" stroke="#22D3EE" stroke-opacity=".7"/><rect x="56" y="56" width="48" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="56" y="68" width="38" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="56" y="80" width="28" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="56" y="92" width="48" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><text class="mono" x="80.0" y="130" text-anchor="middle">PO</text></g><g class=""><rect x="204" y="30" width="72" height="86" rx="6" fill="#0E121B" stroke="#FF6B2C" stroke-opacity=".7"/><path d="M258 30v18h18" fill="none" stroke="#FF6B2C" stroke-opacity=".7"/><rect x="216" y="56" width="48" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="216" y="68" width="38" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="216" y="80" width="28" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="216" y="92" width="48" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><text class="mono" x="240.0" y="130" text-anchor="middle">INVOICE</text></g><g class=""><rect x="364" y="30" width="72" height="86" rx="6" fill="#0E121B" stroke="#FF3D7F" stroke-opacity=".7"/><path d="M418 30v18h18" fill="none" stroke="#FF3D7F" stroke-opacity=".7"/><rect x="376" y="56" width="48" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="376" y="68" width="38" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="376" y="80" width="28" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="376" y="92" width="48" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><text class="mono" x="400.0" y="130" text-anchor="middle">DELIVERY NOTE</text></g>
<path class="ln flow" d="M80 118 C 80 180, 200 170, 240 200" stroke="#22D3EE" stroke-width="1.5"/><path class="ln flow" d="M240 118 V 200" stroke="#FF6B2C" stroke-width="1.5"/><path class="ln flow" d="M400 118 C 400 180, 280 170, 240 200" stroke="#FF3D7F" stroke-width="1.5"/>
<g class="float"><g stroke="url(#payables-g)" stroke-width="1.6" fill="#0E121B"><path d="M240 196l44 24v44l-44 24-44-24v-44z"/><path d="M196 220l44 24 44-24M240 244v44" fill="none"/></g>
<text class="mono" x="240" y="236" text-anchor="middle" style="fill:#F2F0EB">ERP</text></g>
<g transform="translate(360 210)"><circle r="18" fill="#0E121B" stroke="#A3E635"/><circle cx="0" cy="-5" r="5" fill="none" stroke="#A3E635"/><path d="M-9 10c2-7 16-7 18 0" fill="none" stroke="#A3E635"/><circle class="blink" cx="14" cy="-14" r="3.5" fill="#A3E635"/></g>
<text class="mono" x="360" y="246" text-anchor="middle">HUMAN CHECKPOINT</text>
<text class="mono" x="110" y="246" text-anchor="middle">3-WAY MATCH</text><text class="mono" x="110" y="262" text-anchor="middle" style="fill:#A3E635">✓ ✓ ✓</text>

</svg>