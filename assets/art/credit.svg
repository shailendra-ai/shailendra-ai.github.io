<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Multi-agent credit assessment from financial statements" class="art-credit">
<title>Multi-agent credit assessment from financial statements</title>
<defs>
<linearGradient id="credit-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#FF6B2C"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
<linearGradient id="credit-gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B2C" stop-opacity=".55"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></linearGradient>
<filter id="credit-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="credit-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="credit-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F2F0EB" stroke-opacity=".06"/></pattern>
</defs>
<style>
.art-credit .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art-credit .mono{font:500 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#9AA0AB}
.art-credit .flow{stroke-dasharray:6 8;animation:credit-flow 2.4s linear infinite}
.art-credit .pulse{animation:credit-pulse 2.6s ease-in-out infinite}
.art-credit .blink{animation:credit-blink 1.6s steps(2,end) infinite}
.art-credit .scan{animation:credit-scan 3.2s ease-in-out infinite}
.art-credit .spin{transform-origin:center;transform-box:fill-box;animation:credit-spin 12s linear infinite}
.art-credit .float{animation:credit-float 5s ease-in-out infinite}
@keyframes credit-flow{to{stroke-dashoffset:-28}}
@keyframes credit-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes credit-blink{50%{opacity:.15}}
@keyframes credit-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,80px))}}
@keyframes credit-spin{to{transform:rotate(360deg)}}
@keyframes credit-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media (prefers-reduced-motion:reduce){.art-credit *{animation:none}}
</style>
<rect width="480" height="300" fill="url(#credit-grid)"/>
<ellipse cx="240" cy="160" rx="200" ry="110" fill="#FF6B2C" fill-opacity=".12" filter="url(#credit-blur)"/>

<g class=""><rect x="40" y="60" width="100" height="150" rx="6" fill="#0E121B" stroke="#FF6B2C" stroke-opacity=".7"/><path d="M122 60v18h18" fill="none" stroke="#FF6B2C" stroke-opacity=".7"/><rect x="52" y="86" width="76" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="98" width="66" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="110" width="56" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="122" width="76" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="134" width="66" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="146" width="56" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="158" width="76" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="170" width="66" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><rect x="52" y="182" width="56" height="3" rx="1.5" fill="#F2F0EB" fill-opacity=".35"/><text class="mono" x="90.0" y="224" text-anchor="middle">STATEMENTS</text></g>
<g><rect x="52" y="86" width="40" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/><rect x="52" y="100" width="53" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/><rect x="52" y="114" width="66" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/><rect x="52" y="128" width="79" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/><rect x="52" y="142" width="52" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/><rect x="52" y="156" width="65" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/><rect x="52" y="170" width="78" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/><rect x="52" y="184" width="51" height="4" rx="2" fill="#FF6B2C" fill-opacity=".35"/></g>
<g stroke="#FF6B2C" stroke-width="1.2" fill="#0E121B">
<circle class="pulse" cx="230" cy="90" r="16"/><circle class="pulse" cx="230" cy="150" r="16" style="animation-delay:.6s"/><circle class="pulse" cx="230" cy="210" r="16" style="animation-delay:1.2s"/>
</g>
<text class="mono" x="230" y="93" text-anchor="middle" style="fill:#F2F0EB">A1</text><text class="mono" x="230" y="153" text-anchor="middle" style="fill:#F2F0EB">A2</text><text class="mono" x="230" y="213" text-anchor="middle" style="fill:#F2F0EB">A3</text>
<path class="ln flow" d="M142 110 C 180 110, 190 90, 212 90" stroke="#FF6B2C" stroke-width="1.5"/><path class="ln flow" d="M142 135 C 180 135, 190 150, 212 150" stroke="#FF6B2C" stroke-width="1.5"/><path class="ln flow" d="M142 160 C 180 160, 190 210, 212 210" stroke="#FF6B2C" stroke-width="1.5"/>
<path class="ln flow" d="M248 90 C 300 90, 300 140, 330 140" stroke="#FF3D7F" stroke-width="1.5"/><path class="ln flow" d="M248 150 C 300 150, 300 140, 330 140" stroke="#FF3D7F" stroke-width="1.5"/><path class="ln flow" d="M248 210 C 300 210, 300 140, 330 140" stroke="#FF3D7F" stroke-width="1.5"/>
<path class="ln" d="M345 190 A 55 55 0 1 1 435 190" stroke="#9AA0AB" stroke-opacity=".4" stroke-width="8"/>
<path class="ln" d="M345 190 A 55 55 0 0 1 418 112" stroke="url(#credit-g)" stroke-width="8"/>
<line class="ln" x1="390" y1="178" x2="416" y2="128" stroke="#F2F0EB" stroke-width="2"/><circle cx="390" cy="178" r="4" fill="#F2F0EB"/>
<text x="390" y="222" text-anchor="middle" font-family="Syne,sans-serif" font-weight="800" font-size="22" fill="#F2F0EB">A-</text>
<text class="mono" x="390" y="240" text-anchor="middle">CREDIT VIEW · 4 MIN</text>
<text class="mono" x="230" y="44" text-anchor="middle">PARALLEL AGENTS</text>

</svg>